apiVersion: apps/v1
kind: Deployment
metadata:
  name: agbara-integration-server
  labels:
    app: agbara-integration
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agbara-integration
  template:
    metadata:
      labels:
        app: agbara-integration
        version: v1.0.0
    spec:
      containers:
      - name: agbara-server
        image: agbara-integration-server:production
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: WORKERS
          value: "4"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: agbara-integration-server
  labels:
    app: agbara-integration
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
  selector:
    app: agbara-integration
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agbara-integration-server-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agbara-integration-server
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80